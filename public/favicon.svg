<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ARAHKAII">
    <rect class="tile" width="128" height="128" />
    <!-- Didone capital A: outer triangle with an evenodd counter -->
    <path class="mark" fill-rule="evenodd" d="M64 26 L106 104 L22 104 Z M64 60 L86 104 L42 104 Z" />
    <!-- crossbar -->
    <rect class="mark" x="52" y="83" width="24" height="7" />
    <!-- foot serifs -->
    <rect class="mark" x="15" y="101" width="24" height="6" />
    <rect class="mark" x="89" y="101" width="24" height="6" />
    <style>
        .tile { fill: #F6F1EA; }
        .mark { fill: #111111; }
        @media (prefers-color-scheme: dark) {
            .tile { fill: #111111; }
            .mark { fill: #F6F1EA; }
        }
    </style>
</svg>
