name: Publish scheduled articles

on:
  schedule:
    # Minute 17 avoids GitHub's busiest hour boundary. UTC; hourly in Singapore too.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Rebuild production for due, approved articles (otherwise check only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scheduled-publishing-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'nicholsmindset/arahkaii_blog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Check due articles
        id: due
        run: node scripts/scheduled-publishing.mjs
      - name: Verify reviewed content before rebuilding
        if: steps.due.outputs.needs_rebuild == 'true' && (github.event_name == 'schedule' || inputs.deploy)
        run: npm run verify
      - name: Publish due stories and confirm the production sitemap
        if: steps.due.outputs.needs_rebuild == 'true' && (github.event_name == 'schedule' || inputs.deploy)
        run: node scripts/scheduled-publishing.mjs --deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
