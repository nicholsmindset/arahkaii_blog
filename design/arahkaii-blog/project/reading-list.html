<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your reading list — Arahkaii</title>
<link rel="stylesheet" href="assets/arahkaii.css">
<style>
  .rl-head{ padding:160px 0 0; }
  .rl-title{ font-family:var(--serif); font-variation-settings:'opsz' 144; font-weight:380; font-size:clamp(48px,8vw,76px); line-height:1; letter-spacing:-.02em; margin:0; }
  .rl-dek{ font-family:var(--serif); font-style:italic; font-variation-settings:'opsz' 96; font-size:clamp(19px,2.4vw,25px); color:var(--muted); margin:18px 0 0; }
  .rl-count{ font-family:var(--sans); font-size:12px; letter-spacing:.04em; color:var(--muted); margin-top:14px; }

  .rl-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:64px 44px; margin-top:64px; padding-top:36px; border-top:1px solid var(--hairline); }
  .rl-card{ position:relative; }
  .rl-card .headline{ font-size:23px; margin:20px 0 10px; }
  .rl-remove{ position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:999px; background:rgba(246,241,233,.88); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:3; opacity:0; transition:opacity var(--settle); border:0; }
  .rl-card:hover .rl-remove, .rl-remove:focus-visible{ opacity:1; }
  .rl-remove svg{ width:14px; height:14px; color:var(--ink); }

  .rl-empty{ margin-top:72px; padding:80px 0; border-top:1px solid var(--hairline); border-bottom:1px solid var(--hairline); text-align:center; }
  .rl-empty .e-mark{ width:48px; height:48px; margin:0 auto 24px; color:var(--muted); }
  .rl-empty p{ font-family:var(--serif); font-style:italic; font-variation-settings:'opsz' 72; font-size:26px; color:var(--ink); margin:0 auto 10px; max-width:24ch; }
  .rl-empty .sub{ font-family:var(--sans); font-style:normal; font-size:13px; letter-spacing:.03em; color:var(--muted); max-width:42ch; margin:0 auto 28px; line-height:1.6; }

  @media (max-width:900px){ .rl-grid{ grid-template-columns:1fr 1fr; gap:48px 32px; } }
  @media (max-width:760px){ .rl-head{ padding-top:108px; } .rl-grid{ grid-template-columns:1fr; gap:48px; } }
</style>
</head>
<body data-cat="" data-screen-label="Reading list">
  <main class="wrap">
    <header class="rl-head">
      <h1 class="rl-title">Reading list</h1>
      <p class="rl-dek">Saved for a slower moment.</p>
      <p class="rl-count" id="count"></p>
    </header>
    <div id="container"></div>
  </main>

  <script src="assets/arahkaii.js"></script>
  <script>
    (function(){
      const A=window.ARAHKAII;
      const c=document.getElementById('container');
      const count=document.getElementById('count');
      function render(){
        const items=A.getSaved();
        count.textContent = items.length ? items.length+(items.length===1?' story':' stories')+' saved' : '';
        if(!items.length){
          c.innerHTML=`<div class="rl-empty">
            <svg class="e-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg>
            <p>Nothing saved yet.</p>
            <p class="sub">Tap the bookmark on any story and it will wait for you here — across visits, on this device.</p>
            <a class="link-more" href="latest.html">Browse the latest</a>
          </div>`;
          return;
        }
        const grid=document.createElement('div'); grid.className='rl-grid';
        items.forEach(it=>{
          const card=document.createElement('div'); card.className='rl-card';
          card.innerHTML=`<a class="story" href="${it.href}">
              <div class="img ph ${it.tone||'tone-b'} r-3x2"></div>
              <h3 class="headline">${it.title}</h3>
              <p class="byline">${it.byline||''}</p>
            </a>
            <button class="rl-remove" aria-label="Remove from reading list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;
          card.querySelector('.rl-remove').addEventListener('click',(e)=>{
            e.preventDefault(); e.stopPropagation();
            A.toggleSave({title:it.title}); A.toast('Removed from your reading list'); render();
          });
          grid.appendChild(card);
        });
        c.innerHTML=''; c.appendChild(grid);
      }
      render();
    })();
  </script>
</body>
</html>
