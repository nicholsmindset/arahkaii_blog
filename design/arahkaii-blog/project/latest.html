<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latest — Arahkaii</title>
<link rel="stylesheet" href="assets/arahkaii.css">
<style>
  .lt-head{ padding:160px 0 0; }
  .lt-title{ font-family:var(--serif); font-variation-settings:'opsz' 144; font-weight:380; font-size:clamp(48px,8vw,76px); line-height:1; letter-spacing:-.02em; margin:0; }
  .lt-dek{ font-family:var(--serif); font-style:italic; font-variation-settings:'opsz' 96; font-size:clamp(19px,2.4vw,25px); color:var(--muted); margin:18px 0 0; }

  .lt-lead{ display:grid; grid-template-columns:1.4fr 1fr; gap:56px; align-items:end; margin-top:64px; padding-top:40px; border-top:1px solid var(--hairline); }
  .lt-lead .img{ width:100%; }
  .lt-lead .headline{ font-size:clamp(30px,3.6vw,46px); }
  .lt-lead .ll-dek{ font-size:19px; color:var(--muted); margin:16px 0 0; max-width:40ch; }
  .lt-lead .byline{ margin-top:18px; }

  .lt-feed{ margin-top:88px; }
  .lt-row{ display:grid; grid-template-columns:150px 1fr auto; gap:40px; align-items:baseline; padding:30px 0; border-top:1px solid var(--hairline); transition:padding var(--settle); }
  .lt-row:last-child{ border-bottom:1px solid var(--hairline); }
  .lt-row .lr-date{ font-family:var(--sans); font-size:12px; letter-spacing:.04em; color:var(--muted); }
  .lt-row .lr-mid .lr-cat{ font-family:var(--sans); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  .lt-row .lr-title{ font-family:var(--serif); font-variation-settings:'opsz' 72; font-weight:420; font-size:26px; line-height:1.12; letter-spacing:-.01em; margin:8px 0 0; transition:color var(--settle); }
  .lt-row:hover .lr-title{ color:var(--accent); }
  .lt-row .lr-read{ font-family:var(--sans); font-size:12px; letter-spacing:.04em; color:var(--muted); white-space:nowrap; }

  @media (max-width:860px){
    .lt-lead{ grid-template-columns:1fr; gap:24px; }
    .lt-row{ grid-template-columns:1fr; gap:8px; padding:24px 0; }
    .lt-row .lr-read{ display:none; }
    .lt-head{ padding-top:108px; }
  }
</style>
</head>
<body data-cat="" data-screen-label="Latest">
  <main class="wrap">
    <header class="lt-head">
      <h1 class="lt-title">Latest</h1>
      <p class="lt-dek">Everything we&rsquo;ve published, newest first.</p>
    </header>
    <div id="lead"></div>
    <div class="lt-feed" id="feed"></div>
  </main>

  <script src="assets/arahkaii.js"></script>
  <script>
    (function(){
      const A=window.ARAHKAII;
      const arts=[...A.articles].sort((a,b)=> b.d.localeCompare(a.d));
      const lead=arts[0], rest=arts.slice(1);
      document.getElementById('lead').innerHTML=`
        <a class="story lt-lead" href="${lead.h}">
          <div class="img ph ${lead.tone} r-16x9 blurup in"><span class="lab">${lead.c} \u00b7 16:9</span></div>
          <div>
            <span class="eyebrow accent" style="display:block; margin-bottom:14px">${lead.c} \u00b7 Newest</span>
            <h2 class="headline">${lead.t}</h2>
            <p class="byline" style="margin-top:18px">By ${lead.a} \u00b7 ${A.fmtDate(lead.d)} \u00b7 ${lead.r} min read</p>
          </div>
        </a>`;
      document.getElementById('feed').innerHTML = rest.map(x=>`
        <a class="story lt-row" href="${x.h}">
          <span class="lr-date">${A.fmtDate(x.d)}</span>
          <div class="lr-mid"><span class="lr-cat">${x.c}</span><div class="lr-title">${x.t}</div></div>
          <span class="lr-read">${x.a} \u00b7 ${x.r} min</span>
        </a>`).join('');
      if(A.observe) A.observe();
    })();
  </script>
</body>
</html>
